name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"
      - name: Check Swift formatting
        run: |
          xcrun swift-format format --in-place --recursive Sources Tests Package.swift
          git diff --exit-code
      - run: swift test -j 2

  # Merge gate: the one CI check the default-branch ruleset requires. Always
  # runs; fails only when a needed job failed or was cancelled (skipped passes).
  ci-ok:
    if: always()
    needs: [swift]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
